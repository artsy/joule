name: Security Bounty Rotation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * FRI"

jobs:
  next-on-call:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.JS
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: yarn install

      - name: Run CLI
        id: cli
        run: echo "PAYLOAD=$(/home/runner/work/joule/joule/node_modules/.bin/artsy scheduled:security-bounty-rotation)" >> "$GITHUB_OUTPUT"
        env:
          OPSGENIE_API_KEY: ${{ secrets.OPSGENIE_API_KEY }}
          SLACK_WEB_API_TOKEN: ${{ secrets.SLACK_WEB_API_TOKEN }}
          ORBIT_URL: ${{ secrets.ORBIT_URL || vars.ORBIT_URL }}
          ORBIT_TOKEN: ${{ secrets.ORBIT_TOKEN }}
          ORBIT_SECURITY_BOUNTY_ROTATION_ID: ${{ vars.ORBIT_SECURITY_BOUNTY_ROTATION_ID }}

      - name: Standup Reminder > Slack
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: ${{steps.cli.outputs.PAYLOAD}}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PRODUCT_BOUNTY_ROTATIONS_URL }}
